<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bagah System | Secure Area</title>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050505;
            --surface: #0f0f13;
            --primary: #facc15;
            --danger: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #27272a;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-image: 
                linear-gradient(rgba(15, 15, 19, 0.9), rgba(5, 5, 5, 0.9)),
                linear-gradient(90deg, var(--border) 1px, transparent 1px),
                linear-gradient(var(--border) 1px, transparent 1px);
            background-size: 100% 100%, 30px 30px, 30px 30px;
        }
        header {
            width: 100%; padding: 15px 20px; display: flex; align-items: center; justify-content: space-between;
            border-bottom: 1px solid var(--border); background: rgba(5, 5, 5, 0.8); backdrop-filter: blur(10px);
        }
        .logo-area { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; }
        .logo-icon { width: 30px; height: 30px; background: var(--primary); color: #000; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-family: 'Fira Code', monospace; font-size: 18px; }
        .status-badge { font-size: 11px; padding: 4px 10px; border-radius: 20px; background: rgba(250, 204, 21, 0.1); color: var(--primary); border: 1px solid rgba(250, 204, 21, 0.3); font-family: 'Fira Code', monospace; }
        
        .center-container { flex: 1; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 20px; text-align: center; }
        .center-container.active { display: flex; }
        
        .denied-box { background: rgba(20, 0, 0, 0.8); border: 1px solid var(--danger); border-radius: 12px; padding: 30px; max-width: 400px; width: 100%; box-shadow: 0 0 30px rgba(239, 68, 68, 0.2); }
        .denied-icon { font-size: 50px; margin-bottom: 15px; }
        .denied-box h1 { color: var(--danger); font-size: 22px; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 2px; }
        .denied-box p { color: var(--text-muted); font-size: 14px; line-height: 1.5; margin-bottom: 20px; }
        .error-code { font-family: 'Fira Code', monospace; font-size: 12px; background: #000; padding: 8px; border-radius: 6px; color: var(--danger); border: 1px dashed var(--danger); }

        #code-screen { flex: 1; width: 100%; max-width: 1000px; margin: 0 auto; padding: 20px; display: none; flex-direction: column; }
        #code-screen.active { display: flex; }
        .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .toolbar h3 { font-size: 14px; color: var(--text-muted); font-weight: 400; }
        .btn-copy { background: var(--primary); color: #000; border: none; padding: 10px 20px; font-weight: bold; border-radius: 8px; cursor: pointer; font-size: 13px; transition: all 0.2s; display: flex; align-items: center; gap: 8px; }
        .btn-copy:hover { background: #fff; box-shadow: 0 0 15px rgba(250, 204, 21, 0.4); }
        .btn-copy:active { transform: scale(0.95); }
        .code-wrapper { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; flex: 1; display: flex; }
        pre { margin: 0; padding: 20px; overflow: auto; font-family: 'Fira Code', monospace; font-size: 13px; line-height: 1.6; color: #e2e8f0; width: 100%; height: 60vh; }
        pre::-webkit-scrollbar { width: 8px; height: 8px; }
        pre::-webkit-scrollbar-track { background: var(--surface); }
        pre::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
        .fade-in { animation: fadeIn 0.5s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <header>
        <div class="logo-area"><div class="logo-icon">B</div>Bagah System</div>
        <div class="status-badge" id="header-status">CHECKING...</div>
    </header>

    <div id="denied-screen" class="center-container">
        <div class="denied-box fade-in">
            <div class="denied-icon">🛑</div>
            <h1>Access Denied</h1>
            <p>Hệ thống không tìm thấy mã truy cập hợp lệ. Vui lòng thêm <b>?key=admin</b> vào cuối đường dẫn URL.</p>
            <div class="error-code">ERROR: 403_FORBIDDEN<br>MISSING_URL_KEY</div>
        </div>
    </div>

    <div id="code-screen">
        <div class="toolbar fade-in">
            <h3>// Trạng thái: <span style="color: var(--primary);">Đã xác minh (Admin)</span></h3>
            <button class="btn-copy" onclick="copyCode()">Copy Raw Code</button>
        </div>
        <div class="code-wrapper fade-in">
            <pre id="codeBlock">Đang tải dữ liệu...</pre>
        </div>
    </div>

    <script>
        // ĐÂY LÀ NỘI DUNG CODE LUA CỦA BẠN (Dán vào giữa 2 dấu backtick)
        const SECRET_LUA_CODE = `local SUPPORTED_GAMES = {
    ["Evade"] = {
        full = "https://api.jnkie.com/.../download",
        farmOnly = "https://api.jnkie.com/.../download",
        placeIds = { 10324346056, 9872472334 }
    }
}
-- Code Lua của bạn ở đây...`;

        // MẬT KHẨU ĐỂ VÀO WEB (Bạn có thể đổi chữ admin thành chữ khác tùy thích)
        const SECRET_KEY = "18062012"; 

        function checkAccess() {
            const deniedScreen = document.getElementById('denied-screen');
            const codeScreen = document.getElementById('code-screen');
            const headerStatus = document.getElementById('header-status');

            // Lấy phần URL sau dấu ?
            const urlParams = new URLSearchParams(window.location.search);
            const key = urlParams.get('key');

            // Nếu key trên URL giống với SECRET_KEY
            if (key === SECRET_KEY) {
                document.getElementById('codeBlock').textContent = SECRET_LUA_CODE;
                codeScreen.classList.add('active');
                headerStatus.textContent = "SECURE";
                headerStatus.style.color = "#4ade80";
                headerStatus.style.borderColor = "rgba(74, 222, 128, 0.3)";
                headerStatus.style.background = "rgba(74, 222, 128, 0.1)";
            } else {
                // Nếu không có key hoặc key sai -> Chặn
                deniedScreen.classList.add('active');
                headerStatus.textContent = "BLOCKED";
                headerStatus.style.color = "#ef4444";
                headerStatus.style.borderColor = "rgba(239, 68, 68, 0.3)";
                headerStatus.style.background = "rgba(239, 68, 68, 0.1)";
            }
        }

        function copyCode() {
            const codeText = document.getElementById('codeBlock').textContent;
            navigator.clipboard.writeText(codeText).then(() => {
                const btn = document.querySelector('.btn-copy');
                const originalHTML = btn.innerHTML;
                btn.innerHTML = '✅ Đã Copy!';
                btn.style.background = '#4ade80';
                setTimeout(() => {
                    btn.innerHTML = originalHTML;
                    btn.style.background = 'var(--primary)';
                }, 2000);
            }).catch(err => alert("Lỗi khi copy!"));
        }

        checkAccess();
    </script>
</body>
</html>
